services:
  db:
    build:
      context: ./backend/passwordDB
      dockerfile: Dockerfile.pg
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "SecuraDB"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend/API
    ports:
      - "5222:5222"
    environment:
      - DefaultConnection=Host=db;Port=5432;Database=SecuraDB;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Crypto__TokenKey=${TOKEN_KEY}
      - Crypto__PasswordKey=${PASSWORD_KEY}
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./backend/API:/app
    depends_on:
      - db

  frontend:
    build: ./frontend/app
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/app:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pg_data:
  frontend_node_modules:
